services:
  mongodb:
    image: mongo:7
    container_name: ligapro_database
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ligapro_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb+srv://admin_user_01:adminsecret26@cluster0.yjlzr.mongodb.net/club_deportivo?retryWrites=true&w=majority
      - JWT_SECRET=fa1c74076bc52cf10a034b48063c363b99bff247ac36dac846b7c022ea02b2a6
      - NODE_ENV=production
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ligapro_frontend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
